spring:
  application:
    name: cross-border-erp
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${BACKEND_PORT:8090}

app:
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-minutes: 15
    refresh-token-days: 7
    max-login-failures: 5
    lock-minutes: 15
    refresh-cookie-name: cross_erp_refresh
    secure-cookie: ${SECURE_COOKIE:false}
