spring:
  datasource:
    url: jdbc:h2:mem:cross_erp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  database-platform: org.hibernate.dialect.MySQLDialect
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  auth:
    jwt-secret: test-only-secret-that-is-at-least-thirty-two-bytes-long
    access-token-minutes: 15
    refresh-token-days: 7
    max-login-failures: 5
    lock-minutes: 15
    refresh-cookie-name: cross_erp_refresh
    secure-cookie: false
